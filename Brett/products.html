<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Hoosier Hops & Raw</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">&#x1f430;</div>
        <span>Hoosier Hops & Raw</span>
      </a>
      <button class="hamburger" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Shop</a>
        <a href="calendar.html">Calendar</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Shop Hero -->
  <div class="photo-banner dogs" style="padding: 3rem 1.5rem;">
    <h2>Shop Our Products & Animals</h2>
    <p>Browse rabbits, raw dog feed, and handcrafted goods. Reach out to inquire about any item.</p>
  </div>

  <!-- Products Section -->
  <section>
    <div class="container">

      <!-- Filter Tabs -->
      <div class="product-tabs">
        <button class="tab-btn active" onclick="filterProducts('all', this)">All</button>
        <button class="tab-btn" onclick="filterProducts('animals', this)">Animals</button>
        <button class="tab-btn" onclick="filterProducts('animal-products', this)">Raw Feed & Products</button>
        <button class="tab-btn" onclick="filterProducts('trinkets', this)">Trinkets & Goods</button>
      </div>

      <!-- Product Grid -->
      <div class="product-grid" id="productGrid">
        <!-- Products inserted by JS -->
      </div>

      <p id="emptyMsg" style="text-align:center; color: var(--text-light); padding: 3rem 0; display:none;">
        No items in this category yet. Check back soon!
      </p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Hoosier Hops & Raw LLC &mdash; Indiana | <a href="contact.html">Get in Touch</a></p>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/products.js"></script>
</body>
</html>
